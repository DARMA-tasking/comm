name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
      macos-matrix: ${{ steps.macos-matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate build matrix
        id: generate-matrix
        uses: docker/bake-action/subaction/matrix@v7
        with:
          target: comm-build-all
          files: docker-bake.hcl

      - name: Checkout shared runner configurations
        uses: actions/checkout@v6
        with:
          repository: DARMA-tasking/workflows
          ref: master
          path: .ci-workflows
          persist-credentials: false

      - name: Select native macOS MPI configuration
        id: macos-matrix
        shell: bash
        run: |
          matrix=$(jq -ce '
            [.matrix[] | select(.setup == "arm64-macos-15-clang-14-cpp")]
            | if length == 1 then . else error("Expected one macOS MPI runner") end
          ' .ci-workflows/ci/shared/matrix/github.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS build and tests (${{ matrix.runs-on }}, MPICH)
    runs-on: ${{ matrix.runs-on }}
    needs:
      - prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.macos-matrix) }}
    env:
      CMAKE_BUILD_TYPE: Debug
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
      VT_BACKEND_ENABLED: 'OFF'
      COMM_DOXYGEN_ENABLED: '0'
      # Use the runner's Apple Clang through MPICH's compiler wrappers.
      MPICH_CC: clang
      MPICH_CXX: clang++

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install native build dependencies
        shell: bash
        run: |
          # Matches the shared setup's packages; CMake >= 3.23 is also required.
          brew install ccache coreutils ninja mpich cmake
          mpi_prefix=$(brew --prefix mpich)
          echo "$mpi_prefix/bin" >> "$GITHUB_PATH"
          echo "CC=$mpi_prefix/bin/mpicc" >> "$GITHUB_ENV"
          echo "CXX=$mpi_prefix/bin/mpicxx" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$mpi_prefix" >> "$GITHUB_ENV"

      - name: Report toolchain
        shell: bash
        run: |
          uname -m
          clang++ --version
          "$CXX" -show
          cmake --version

      - name: Build
        shell: bash
        run: bash ci/build_cpp.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/comm-ci"

      - name: Test
        shell: bash
        run: bash ci/test_cpp.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/comm-ci"

  bake:
    runs-on: ubuntu-latest
    needs:
      - prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: Restore cache
        id: ccache-archive
        uses: actions/cache@v5
        with:
          path: ccache-archive
          key: ${{ matrix.target }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ matrix.target }}-${{ github.ref }}
            ${{ matrix.target }}-

      - name: Inject ccache
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-map: |
            {
              "ccache-archive": {
                "target": "/build/ccache",
                "id": "${{ matrix.target }}"
              }
            }
          skip-extraction: ${{ steps.ccache-archive.outputs.cache-hit }}

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build
        uses: docker/bake-action@v7
        id: build-image
        with:
          source: .
          targets: ${{ matrix.target }}
          files: docker-bake.hcl
          push: ${{ github.ref == 'refs/heads/master' }}
          set: |
            *.args.CACHE_ID=${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GIT_BRANCH: ${{ github.head_ref || github.ref_name }}

      - name: Retrieve build artifacts
        if: ${{ !endsWith(matrix.target, '-docs') }}
        run: |
          # We rely on the persistence of data on cache mounts with identical IDs and builders.
          # This allows us to copy build artifacts from the "bake" step and use the Codecov action within the GitHub environment.

          echo "
          FROM ubuntu:latest
          RUN --mount=type=cache,id=BUILD-${{ matrix.target }},target=/build/comm \
          mkdir -p /comm \
          && cp -p -R /build/comm/. /comm/ || true
          " >> tmp_dockerfile

          docker buildx build --builder ${{ steps.setup-buildx.outputs.name }} -f tmp_dockerfile --output type=local,dest=build .
